# Local development database only. Production uses a managed Postgres (Neon).
name: laapatapaisa
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: laapata
      POSTGRES_PASSWORD: laapata_dev_only
      POSTGRES_DB: laapata
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laapata -d laapata"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
